<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#146b59"><title>入世练习册 · 测测你的社会化程度</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f6f4;color:#1b2546;font:16px/1.7 'Microsoft YaHei',sans-serif}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #ed8053;outline-offset:4px}header{max-width:1120px;margin:auto;padding:25px 26px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;letter-spacing:2px}.small{font-size:14px;color:#6b7490}main{max-width:1100px;margin:30px auto 70px;padding:0 26px}h1{font-size:clamp(40px,6vw,76px);line-height:1.22;letter-spacing:-2px;margin:22px 0}h1 em{font-style:normal;color:#146b59}h2{font-size:30px;line-height:1.5}p{margin:14px 0}.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:50px;align-items:center}.tag{font-size:14px;letter-spacing:3px;color:#465dc3}.lead{color:#69728b;max-width:460px}.primary,.secondary{border:0;border-radius:12px;padding:15px 28px;background:#146b59;color:white}.primary:hover{background:#2033ab}.secondary{background:#e7eaf7;color:#34447c}button:disabled{opacity:.35;cursor:default}.meta{display:flex;gap:24px;margin:22px 0;color:#6b7490;font-size:14px}.art{position:relative;overflow:hidden;height:440px;border-radius:28px;background:#dee5ff;transform:rotate(2deg);box-shadow:0 20px 60px #283b7020}.art svg{width:100%;height:100%}.ticket{position:absolute;left:25px;bottom:25px;right:25px;padding:18px 22px;background:#ffffffed;border-radius:14px;transform:rotate(-5deg);box-shadow:0 8px 25px #15246512}.ticket b{font-size:23px}.ticket span{display:block;font-size:14px;color:#6b7490}.features{display:grid;grid-template-columns:repeat(3,1fr);gap:30px;border-top:1px solid #dce1ef;margin-top:58px;padding-top:28px}.features b{font-size:19px}.features p{font-size:14px;color:#737b93}.panel{max-width:720px;margin:auto;background:white;border:1px solid #e2e6f0;padding:34px;border-radius:22px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.progress{height:6px;border-radius:6px;background:#e9ecf6;margin:18px 0 30px;overflow:hidden}.progress i{display:block;height:100%;background:#465be0;transition:width .2s}.options{display:grid;gap:12px}.option{border:1px solid #dce1ef;background:#f9faff;color:#283558;border-radius:12px;padding:17px 20px;text-align:left;display:flex;gap:18px}.option:hover{border-color:#7280d4}.option[aria-checked=true]{border-color:#344bd8;background:#eef0ff;box-shadow:inset 3px 0 #344bd8}.option span:first-child{color:#6778c1}.nav{display:flex;justify-content:space-between;gap:12px;margin-top:27px}.note{font-size:14px;color:#798199}.result{max-width:850px;margin:auto}.card{padding:40px;background:white;border:1px solid #e1e6f4;border-radius:24px;box-shadow:0 15px 60px #23316d0b}.city{font-size:clamp(60px,10vw,100px);margin:12px 0;line-height:1.2;color:#146b59}.quote{font-size:24px;color:#5363a9}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{background:#edf0ff;border-radius:30px;padding:4px 13px;font-size:14px;color:#5162b0}.details{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin:28px 0}.details h3{margin:0 0 8px;font-size:19px}.details p{color:#68718c}.bars{display:grid;grid-template-columns:1fr 1fr;gap:17px 30px}.bar{height:5px;background:#edf0f8;margin-top:7px}.bar i{display:block;height:100%;background:#6d7de0}.alternatives{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:22px 0}.alternative{border:1px solid #e1e5f2;border-radius:14px;padding:18px;background:#fafbff}.alternative b{font-size:23px}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:25px 0}.status{text-align:center;color:#485fc0;font-size:14px;min-height:24px}footer{text-align:center;padding:10px 24px 28px;font-size:13px;color:#81899e}.suggest{background:#f0f3ff;border-radius:14px;padding:20px;margin-top:26px}.panel,.result{animation:show .3s ease}@keyframes show{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@media(max-width:700px){header{padding:20px}.small{font-size:13px}main{padding:0 20px;margin-top:18px}.hero{grid-template-columns:1fr;gap:25px}.art{height:285px;transform:none}.features{gap:17px;margin-top:36px}.features b{font-size:16px}.panel{padding:25px 20px}h2{font-size:25px}.card{padding:27px 22px}.details{grid-template-columns:1fr;gap:12px}.quote{font-size:21px}.meta{gap:18px}.alternatives{gap:10px}.alternative{padding:14px}}@media print{header,footer,.actions,.status{display:none}main{margin:0;padding:0}.card{box-shadow:none}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.scope{border:0;padding:0;margin:25px 0}.scope legend{font-size:14px;color:#596688;margin-bottom:10px}.scope-options{display:flex;gap:8px;flex-wrap:wrap}.scope label{position:relative;cursor:pointer;flex:1;min-width:115px}.scope input{position:absolute;opacity:0}.scope label>span{display:block;border:1px solid #d5dced;background:#fff;border-radius:12px;padding:11px 13px;font-size:15px}.scope small{display:block;color:#7b85a0;font-size:13px;margin-top:2px}.scope input:checked+span{background:#edf0ff;border-color:#3d53ce;color:#3046be}.scope input:focus-visible+span{outline:3px solid #ed8053;outline-offset:3px}</style></head><body><header><div class="brand">入世练习册 ✳</div><span class="small">SOCIAL ADAPTATION LAB</span></header><main id="app"></main><footer>会相处，也会做自己。<br>原创趣味自评 · 非专业心理测评</footer><script>const groups=[["规则理解","把隐含期待问清楚，减少靠猜做事。"],["表达协商","清楚说需求，也给对方回应的空间。"],["边界维护","能照顾关系，也能照顾自己的承受范围。"],["场合适应","换一种表达方式，也保留自己的立场。"]];const questions=[{"d":0,"title":"刚加入一个新团队，大家没说具体的交付标准。","options":["先做出自己的版本再说","参考同事以往的做法","问清用途、期限和验收标准","等有人提醒再调整"],"values":[0,0,3,1]},{"d":0,"title":"负责人说“这个方案再想想”。","options":["觉得是在否定我，不再追问","直接全部重做","确认需要调整的重点和期望","先改自己最不满意的地方"],"values":[0,0,3,1]},{"d":0,"title":"聚会结账方式没有提前说好。","options":["默认大家会请客","等别人付款后再决定","主动确认AA还是轮流请客","不好意思问，自己全付"],"values":[0,0,3,1]},{"d":0,"title":"接到一件不属于你职责范围的事。","options":["不问原因直接接下","先了解背景，再确认责任与优先级","马上拒绝任何额外工作","先拖着，看是否还会找我"],"values":[0,3,1,0]},{"d":0,"title":"第一次参与陌生场合的活动。","options":["完全按自己熟悉的方式来","先观察流程，必要时问清约定","担心出错，尽量不参与","只照着最活跃的人做"],"values":[0,3,1,0]},{"d":0,"title":"一条群消息可能有两种理解。","options":["按第一反应执行","先猜大家更喜欢哪一种","用具体例子确认对方的意思","等结果出来再解释"],"values":[0,0,3,1]},{"d":1,"title":"朋友临时改计划，影响了你的安排。","options":["说没事，心里一直不舒服","说明影响，并一起商量新方案","直接指责对方不尊重我","不回复，让对方自己意识到"],"values":[0,3,1,0]},{"d":1,"title":"你不同意会议上的一个决定。","options":["在会后反复抱怨","先确认目标，再提出理由与替代方案","当场说这肯定不行","默认别人比我懂，不说意见"],"values":[0,3,1,0]},{"d":1,"title":"你需要别人配合完成任务。","options":["把需求、时间和背景讲清，并确认可行性","只说“帮我一下”","觉得熟人应该知道我需要什么","自己全做掉，免得麻烦别人"],"values":[3,1,0,0]},{"d":1,"title":"你答应的事情可能会延期。","options":["等对方问再说","提前说明进度、影响和新的时间","编个不容易被追问的理由","先说快好了，争取多一点时间"],"values":[0,3,1,0]},{"d":1,"title":"别人误解了你的一句话。","options":["认为解释也没用","重复原话，音量更大一点","说明原意，并问对方听到了什么","立刻改口赞同对方"],"values":[0,0,3,1]},{"d":1,"title":"需要给熟人提一条不太好听的建议。","options":["直接评价对方这个人","先问是否愿意听，再说具体行为与影响","把建议告诉共同朋友","忍着，直到有一次一起爆发"],"values":[0,3,1,0]},{"d":2,"title":"别人打听你不想公开的私事。","options":["怕扫兴，全都回答","明确说这部分暂时不想聊，再换个话题","随便编一个答案应付","觉得被冒犯，立刻反击"],"values":[0,3,1,0]},{"d":2,"title":"朋友反复找你免费帮忙，你已经很累。","options":["继续答应，怕关系变差","明确能帮的范围和这次不能做的部分","突然拉黑，不作说明","口头答应，实际拖着不做"],"values":[0,3,1,0]},{"d":2,"title":"一场可自由参加的聚会，你需要休息。","options":["找个借口，还担心被拆穿","勉强参加，回去特别累","礼貌拒绝，愿意时再约其他时间","答应后临时消失"],"values":[0,0,3,1]},{"d":2,"title":"对方明确说现在不方便聊天。","options":["继续讲，觉得只需要几分钟","尊重暂停，询问是否需要另约时间","觉得是针对我，马上疏远","连续发消息解释我的好意"],"values":[0,3,1,0]},{"d":2,"title":"为了合群，有人劝你做不愿意的事。","options":["大家都做就跟着做","想拒绝但一直含糊回应","清楚拒绝，并接受对方可能失望","先答应，事后埋怨大家"],"values":[0,0,3,1]},{"d":2,"title":"你想借用朋友一件很喜欢的东西。","options":["关系好就直接拿","先征求同意，说清用途归还时间，并接受拒绝","用“你不会这么小气吧”开玩笑","托别人替我说，让对方不好拒绝"],"values":[0,3,1,0]},{"d":3,"title":"向不了解你专业的人解释一个概念。","options":["照用专业词，准确最重要","用对方熟悉的例子，并确认是否讲清","少讲一些，免得麻烦","让对方先自己查"],"values":[0,3,1,0]},{"d":3,"title":"和不同意见的人合作一项任务。","options":["先寻找共同目标，再分清分歧","尽量证明我的办法更好","对方说什么都同意","减少沟通，各做各的"],"values":[3,1,0,0]},{"d":3,"title":"参加一个几乎不认识人的聚会。","options":["强迫自己成为最活跃的人","选择舒服的参与方式，需要时主动交流","只要没一直说话，就觉得自己失败","要求熟人全程陪我"],"values":[0,3,1,0]},{"d":3,"title":"你发现自己说的笑话让人不舒服。","options":["说对方太敏感","解释自己没有恶意就结束","停止这个话题，承认影响并简短道歉","假装没有发生"],"values":[0,0,3,1]},{"d":3,"title":"连续参加活动后，你感觉精力耗尽。","options":["继续撑着才算适应社会","减少安排，补充休息，再决定怎样参与","以后再也不参加任何活动","责怪自己不够外向"],"values":[0,3,1,0]},{"d":3,"title":"你在不同的人面前，表达方式会变化。","options":["只要改变说法就是虚伪","按场合理解调整表达，重要立场保持清楚","完全迎合对方，不表达自己","只坚持一种说法，不管对方能否理解"],"values":[0,3,1,0]}];const types=[["自我节奏探索者","你更习惯先保护自己的节奏，一些没有明说的约定可能仍让你费神。","先从一件小事开始：把“你看着办”变成一个具体问题。"],["情境学习者","你已经在观察人与场合，也开始练习把感受和需求说出来。","下次接到含糊请求，试试问：什么时候需要？做到什么程度？"],["清醒协作者","你往往能兼顾任务、关系与自己的承受范围，愿意把分歧拿到桌面上讨论。","遇到不舒服的请求，先停一下，再给出你能接受的范围。"],["从容适应者","本次答案中，你较常选择澄清期待、协商分歧与尊重边界的处理方式。","不必每次都表现得周全；需要休息时，也允许自己少做一点。"]];function score(a){if(a.length!==24||a.some(v=>!Number.isInteger(v)||v<0||v>3))throw Error('请完成全部题目');const dims=groups.map((_,d)=>Math.round(questions.reduce((n,q,i)=>n+(q.d===d?q.values[a[i]]:0),0)/18*100));const total=Math.round(dims.reduce((a,b)=>a+b,0)/4);return {dims,total,type:total<30?0:total<55?1:total<80?2:3}}
const app=document.getElementById('app');let answers=Array(24).fill(null),pos=0,result;function scrollTopPage(){window.scrollTo(0,0)}
function home(){app.innerHTML=`<section class="hero"><div><div class="tag">SOCIAL ADAPTATION LAB / 入世练习册</div><h1>你在社会里，<br><em>有多游刃有余？</em></h1><p class="lead">看懂场合，表达自己，也守住边界。<br>24个日常情境，看看你现在的社会适应风格。</p><div class="meta"><span>24 道情境题</span><span>约 4 分钟</span><span>4 维画像</span></div><button class="primary" onclick="start()">开始我的入世练习</button><p class="note">选择更接近平时的自己，无需选“应该”的答案。</p></div><div class="art" style="background:#dcece3;transform:none;display:flex;flex-direction:column;justify-content:center;padding:36px"><div class="tag">生活没有统一的通关方式</div><div style="font-size:100px;line-height:1.4;color:#146b59">◉ ◎</div><h2>会相处，也会做自己。</h2><p>规则理解 / 表达协商<br>边界维护 / 场合适应</p><div class="chip">内向与外向，都有自己的自在方式</div></div></section><section class="features"><div><b>不是比谁更圆滑</b><p>关注具体的情境应对。</p></div><div><b>看见四个侧面</b><p>展示分项倾向与练习建议。</p></div><div><b>带走你的名片</b><p>结果可保存为PNG图片。</p></div></section><p class="note">原创趣味自评，未经心理测量学验证，非专业心理测评。“社会化程度”仅为通俗主题，分数不是成熟度、人格优劣或社会价值排名。答案仅在当前页面处理，刷新清空。</p>`}
function start(){answers.fill(null);pos=0;question();scrollTopPage()}
function choose(v){answers[pos]=v;question();document.querySelectorAll('[role=radio]')[v].focus()}
function question(){let q=questions[pos];app.innerHTML=`<section class="panel"><div class="row"><span class="tag">日常情境</span><span>${pos+1} / 24</span></div><div class="progress"><i style="width:${(pos+1)/24*100}%"></i></div><h2 id="qtitle">${q.title}</h2><div role="radiogroup" aria-labelledby="qtitle" class="options">${q.options.map((s,i)=>'<button class="option" role="radio" aria-checked="'+(answers[pos]===i)+'" onclick="choose('+i+')"><span>'+String.fromCharCode(65+i)+'</span><span>'+s+'</span></button>').join('')}</div><div class="nav"><button class="secondary" onclick="pos--;question();scrollTopPage()" ${pos===0?'disabled':''}>上一题</button><button class="primary" onclick="next()" ${answers[pos]===null?'disabled':''}>${pos===23?'查看我的画像':'下一题'}</button></div><p class="note">按实际习惯选择；可以返回修改答案。</p></section>`}
function next(){if(answers[pos]===null)return;if(pos<23){pos++;question()}else show();scrollTopPage()}
function show(){result=score(answers);let t=types[result.type];let low=result.dims.indexOf(Math.min(...result.dims));app.innerHTML=`<section class="result"><div class="card"><div class="tag">你的入世练习册 / 本次答题画像</div><h1 style="font-size:42px">${t[0]}</h1><p class="quote">社会适应自评指数 <b>${result.total}</b> / 100</p><p>${t[1]}</p><div class="bars">${groups.map((g,i)=>'<div>'+g[0]+' <b>'+result.dims[i]+'</b><div class="bar"><i style="width:'+result.dims[i]+'%"></i></div><p class="note">'+g[1]+'</p></div>').join('')}</div><div class="suggest"><b>下一次，可以试试</b><p>${groups[low][1]}</p><p>${t[2]}</p></div><p class="note">分数表示与本题库中“澄清、协商、尊重边界”选项的接近程度，不是人群百分位，也不代表现实能力。高分不要求外向、讨好或忍耐不合理要求。题目使用固定人工权重，结果会随状态与自我判断变化。</p></div><div class="actions"><button class="primary" onclick="save()">保存我的画像</button><button class="secondary" onclick="pos=23;question();scrollTopPage()">修改答案</button><button class="secondary" onclick="start()">重新测试</button></div><div class="status" id="status" aria-live="polite"></div></section>`}
async function save(){try{await document.fonts.ready;let c=document.createElement('canvas');c.width=1000;c.height=1300;let x=c.getContext('2d');x.fillStyle='#f2f6f4';x.fillRect(0,0,1000,1300);x.fillStyle='#146b59';x.font='28px Microsoft YaHei';x.fillText('入世练习册 · 社会化程度趣味测试',70,100);x.font='bold 64px Microsoft YaHei';x.fillText(types[result.type][0],70,230);x.font='bold 100px Microsoft YaHei';x.fillText(result.total+' / 100',70,380);x.font='26px Microsoft YaHei';x.fillText('本次社会适应自评指数 · 非人群排名',70,445);groups.forEach((g,i)=>{let y=560+i*120;x.fillStyle='#263f36';x.fillText(g[0]+'  '+result.dims[i],70,y);x.fillStyle='#d9e7df';x.fillRect(70,y+22,850,12);x.fillStyle='#146b59';x.fillRect(70,y+22,850*result.dims[i]/100,12)});x.fillStyle='#53665c';x.font='26px Microsoft YaHei';x.fillText('会相处，也会做自己。',70,1130);x.font='22px Microsoft YaHei';x.fillText('原创趣味自评 · 非专业心理测评 · 不评判人格优劣',70,1210);let a=document.createElement('a');a.download='我的社会适应画像.png';a.href=c.toDataURL('image/png');a.click();document.getElementById('status').textContent='已生成图片；如浏览器未保存，可截图保存结果。'}catch(e){document.getElementById('status').textContent='当前浏览器未能下载，请截图保存结果。'}}home();</script></body></html>
